<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RISE — Cloud Portability Verification</title>
<link rel="icon" href="/static/brand/rise-icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/rise.css">
<style>
/* Layout: glass sidebar with the journey; main column = providers strip on top, then step panels in a 12-col grid. */
.shell { display: grid; grid-template-columns: 236px 1fr; gap: 20px; padding: 20px; min-height: 100%; }
@media (max-width: 980px) { .shell { grid-template-columns: 1fr; } .side { position: static !important; } }

.side { position: sticky; top: 20px; align-self: start; padding: 20px 14px; display: flex; flex-direction: column; gap: 4px; max-height: calc(100vh - 40px); }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 10px 18px; font: 650 18px/1 var(--f-ui); letter-spacing: .16em; }
.brand img { width: 28px; height: 28px; }
.nav { display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 12px; font-size: 13.5px; color: var(--muted); text-decoration: none; transition: background .3s; }
.nav .n { font: 500 11px/1 var(--f-mono); }
.nav .d { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); transition: background .4s; }
.nav[data-s="done"] .d, .nav[data-s="skipped"] .d { background: var(--ok); }
.nav[data-s="attention"] .d, .nav[data-s="fail"] .d { background: var(--bad); }
.nav[data-s="running"] .d { background: var(--accent); animation: pulse 1s infinite; }
.nav.next { background: var(--glass-strong); color: var(--ink); font-weight: 600; box-shadow: inset 0 1px 0 var(--edge), 0 2px 8px -2px rgba(26,41,63,.14); }
.side-foot { margin-top: auto; padding: 14px 10px 4px; display: grid; gap: 6px; font: 11.5px/1.4 var(--f-mono); color: var(--muted); border-top: 1px solid var(--line); }
.side-foot b { color: var(--ink); font-weight: 500; }

main { display: grid; gap: 20px; align-content: start; min-width: 0; }
.head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px; padding: 6px 4px 0; }
.head h1 { font-size: clamp(26px, 2.6vw, 36px); font-weight: 600; line-height: 1.1; margin-top: 8px; }
.head p { margin: 8px 0 0; color: var(--muted); max-width: 64ch; }
.head .actions { margin-left: auto; display: flex; gap: 10px; flex-wrap: wrap; }

/* providers strip */
.providers { display: grid; grid-template-columns: 1fr 150px 1fr; gap: 14px; align-items: stretch; }
@media (max-width: 760px) { .providers { grid-template-columns: 1fr; } .route { min-height: 60px; } }
.prov { padding: 18px 20px; display: grid; gap: 8px; transition: opacity .6s var(--ease), filter .6s var(--ease), transform .6s var(--ease); }
.prov .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.prov .name { font-size: 21px; font-weight: 600; letter-spacing: -.02em; }
.prov .meta { font: 12px/1.6 var(--f-mono); color: var(--muted); }
.prov .meta b { color: var(--ink); font-weight: 500; }
.prov.dim { opacity: .45; filter: grayscale(1); transform: scale(.985); }
.prov.active { box-shadow: inset 0 1px 0 var(--edge), 0 0 0 2px rgba(37,99,235,.55), var(--shadow); }
.sim { font: 500 10.5px/1 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--warn); background: var(--warn-bg); padding: 4px 6px; border-radius: 5px; }
.route { display: grid; place-items: center; position: relative; }
.route .wire { width: 100%; height: 3px; border-radius: 3px; background: linear-gradient(90deg, var(--accent), var(--ok)); transition: opacity .5s, background .5s; }
.route .lbl { position: absolute; top: calc(50% + 12px); font: 500 11px/1.3 var(--f-mono); color: var(--muted); text-align: center; }
.route.cut .wire { background: repeating-linear-gradient(90deg, var(--bad) 0 8px, transparent 8px 14px); }
.route.cut .lbl { color: var(--bad); }

/* panels */
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 20px; }
.panel { grid-column: span 6; padding: 20px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.panel.w7 { grid-column: span 7; } .panel.w5 { grid-column: span 5; } .panel.w12 { grid-column: span 12; }
@media (max-width: 1200px) { .panel, .panel.w7, .panel.w5 { grid-column: span 12; } }
.ph { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.ph h2 { font-size: 18px; font-weight: 600; }
.ph .grow { flex: 1; }
.empty { color: var(--muted); font-size: 14px; padding: 6px 0; }

.kpis { display: flex; flex-wrap: wrap; gap: 22px; }
.kpi .v { font: 700 34px/1 var(--f-ui); letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.kpi .l { font-size: 12.5px; color: var(--muted); margin-top: 4px; }

table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: left; font: 500 11px/1 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
.tw { overflow-x: auto; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }

.src-badge { font: 500 11.5px/1 var(--f-mono); padding: 6px 8px; border-radius: 7px; }
.src-badge.live { background: rgba(37,99,235,.10); color: var(--accent); }
.src-badge.cached, .src-badge.rules { background: var(--warn-bg); color: var(--warn); }
.summary { font-size: 14.5px; line-height: 1.55; margin: 0; max-width: 75ch; }
.risk { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; font-size: 13.5px; padding: 8px 0; border-top: 1px solid var(--line); }
.sev { font: 600 10.5px/1 var(--f-mono); text-transform: uppercase; padding: 5px 6px; border-radius: 5px; }
.sev.high { color: var(--bad); background: var(--bad-bg); } .sev.medium { color: var(--warn); background: var(--warn-bg); } .sev.low { color: var(--muted); background: var(--faint); }
.test { display: grid; grid-template-columns: 34px 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
.test .id { font: 500 12px/1.6 var(--f-mono); color: var(--muted); }
.test .why { color: var(--muted); font-size: 13px; }
.origin { font: 500 10.5px/1 var(--f-mono); color: var(--accent); }
.note { font: 12px/1.5 var(--f-mono); color: var(--warn); }

.res { display: inline-flex; align-items: center; gap: 6px; font: 600 11.5px/1 var(--f-mono); padding: 6px 8px; border-radius: 8px; }
.res.pass { color: var(--ok); background: var(--ok-bg); } .res.fail { color: var(--bad); background: var(--bad-bg); }
.res.unsupported, .res.untested { color: var(--warn); background: var(--warn-bg); border: 1px dashed currentColor; }
tr.bad td { background: color-mix(in srgb, var(--bad-bg) 45%, transparent); }
.err { font: 12px/1.45 var(--f-mono); color: var(--bad); margin-top: 4px; overflow-wrap: anywhere; }

.diff { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font: 13px/1.5 var(--f-mono); padding: 12px 14px; border-radius: 14px; background: rgba(255,255,255,.7); border: 1px solid var(--line); }
.diff .minus { color: var(--bad); } .diff .plus { color: var(--ok); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; font: 12.5px/1.45 var(--f-mono); }
.kv dt { color: var(--muted); } .kv dd { margin: 0; overflow-wrap: anywhere; }
.kv .okc { color: var(--ok); } .kv .badc { color: var(--bad); }
.row-btns { display: flex; flex-wrap: wrap; gap: 8px; }

.log { display: grid; gap: 2px; max-height: 360px; overflow-y: auto; font: 12px/1.45 var(--f-mono); }
.ev { display: grid; grid-template-columns: 74px 1fr; gap: 10px; padding: 6px 4px; border-top: 1px solid var(--line); }
.ev .t { color: var(--muted); }
.ev.incompatibility, .ev.error, .ev.cut { color: var(--bad); }
.ev.retest, .ev.verify, .ev.prove, .ev.switch { color: var(--ok); }

.toast { position: fixed; right: 24px; bottom: 24px; max-width: 460px; padding: 14px 16px; border-radius: 16px; font-size: 14px; color: var(--bad); background: var(--glass-strong); box-shadow: var(--shadow), inset 0 0 0 1px var(--bad-bg); opacity: 0; transform: translateY(8px); transition: .3s var(--ease); pointer-events: none; z-index: 10; }
.toast.on { opacity: 1; transform: none; }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>

<div class="shell">
  <aside class="side glass" aria-label="Journey">
    <div class="brand"><img src="/static/brand/rise-icon.svg" alt="">RISE</div>
    <nav id="nav"></nav>
    <div class="side-foot" id="foot"></div>
  </aside>

  <main>
    <header class="head">
      <div>
        <div class="eyebrow">Cloud portability verification · S3 object storage · workload asset-service</div>
        <h1 id="headline">Can asset-service run on the destination?</h1>
        <p>RISE watches the app's real storage calls, has AI turn them into tests, runs them on both providers, and switches only on evidence.</p>
      </div>
      <div class="actions">
        <button class="btn ghost" id="reset" type="button">Reset demo</button>
        <button class="btn" id="next" type="button">Start</button>
      </div>
    </header>

    <section class="providers" aria-label="Providers">
      <div class="prov glass" id="prov-source"></div>
      <div class="route" id="route"><div class="wire"></div><div class="lbl" id="route-lbl"></div></div>
      <div class="prov glass" id="prov-destination"></div>
    </section>

    <div class="grid">
      <section class="panel glass w5" id="p-discover"></section>
      <section class="panel glass w7" id="p-analyze"></section>
      <section class="panel glass w7" id="p-challenge"></section>
      <section class="panel glass w5" id="p-adapt"></section>
      <section class="panel glass w7" id="p-verify"></section>
      <section class="panel glass w5" id="p-switch"></section>
      <section class="panel glass w7" id="p-proof"></section>
      <section class="panel glass w5" id="p-log"></section>
    </div>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/static/app.js"></script>
</body>
</html>
