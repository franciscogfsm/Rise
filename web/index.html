<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RISE — Cloud Portability Verification</title>
<link rel="icon" href="/static/brand/rise-icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/rise.css">
<style>
/* Layout: glass sidebar with the journey; main column = providers strip on top, then step panels in a 12-col grid. */
.shell { display: grid; grid-template-columns: 284px 1fr; gap: 20px; padding: 20px; min-height: 100%; }
@media (max-width: 980px) { .shell { grid-template-columns: 1fr; } .side { position: static !important; height: auto !important; } }

.side { position: sticky; top: 20px; align-self: start; height: calc(100vh - 40px); padding: 22px 16px 16px; display: flex; flex-direction: column; gap: 18px; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 12px; padding: 0 6px; }
.brand img { width: 34px; height: 34px; }
.brand .wm { font: 650 20px/1 var(--f-ui); letter-spacing: .2em; }
.brand .tag { font: 500 10.5px/1.2 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-top: 5px; }

.progress { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 18px; background: var(--glass-strong); box-shadow: inset 0 1px 0 var(--edge), 0 6px 18px -10px rgba(26,41,63,.25); }
.ring-wrap { position: relative; width: 58px; height: 58px; flex: none; }
.ring { width: 58px; height: 58px; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 6; }
.ring-bg { stroke: var(--faint); }
.ring-fg { stroke: var(--ok); stroke-linecap: round; transition: stroke-dashoffset .8s var(--ease); }
.ring-n { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 700 17px/1 var(--f-ui); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.ring-n small { font-size: 11px; color: var(--muted); font-weight: 500; margin-left: 1px; }
.p-title { font-weight: 650; font-size: 15px; letter-spacing: -.01em; }
.p-sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }

.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; position: relative; }
.steps::before { content: ""; position: absolute; left: 23px; top: 18px; bottom: 18px; width: 2px; border-radius: 2px; background: var(--faint); }
.step a { display: grid; grid-template-columns: 32px 1fr; gap: 12px; align-items: center; padding: 8px 8px; border-radius: 14px; color: inherit; text-decoration: none; position: relative; transition: background .3s var(--ease); }
.step a:hover { background: rgba(255,255,255,.55); }
.bubble { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font: 600 11.5px/1 var(--f-mono); color: var(--muted); background: var(--bg); box-shadow: inset 0 0 0 1.5px rgba(18,31,53,.14); position: relative; z-index: 1; transition: background .45s var(--ease), color .45s var(--ease), box-shadow .45s var(--ease); }
.st-body { display: grid; min-width: 0; }
.st-title { font-size: 14px; font-weight: 550; color: var(--muted); }
.st-detail { font: 11.5px/1.35 var(--f-mono); color: var(--muted); opacity: .85; overflow-wrap: anywhere; }
.s-done .bubble { background: var(--ok); color: #fff; box-shadow: 0 4px 10px -4px rgba(10,138,116,.6); font-size: 14px; }
.s-done .st-title { color: var(--ink); }
.s-done .st-detail { color: var(--ok); opacity: 1; }
.s-bad .bubble { background: var(--bad); color: #fff; box-shadow: 0 4px 10px -4px rgba(212,81,59,.6); font-size: 14px; }
.s-bad .st-title { color: var(--ink); } .s-bad .st-detail { color: var(--bad); opacity: 1; }
.s-next a, .s-running a { background: var(--glass-strong); box-shadow: inset 0 1px 0 var(--edge), 0 6px 16px -8px rgba(37,99,235,.45); }
.s-next a::before, .s-running a::before { content: ""; position: absolute; left: -16px; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
.s-next .bubble, .s-running .bubble { background: #fff; color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); }
.s-running .bubble { animation: halo 1.2s infinite; }
.s-next .st-title, .s-running .st-title { color: var(--ink); font-weight: 650; }
@keyframes halo { 0% { box-shadow: inset 0 0 0 2px var(--accent), 0 0 0 0 rgba(37,99,235,.45); } 100% { box-shadow: inset 0 0 0 2px var(--accent), 0 0 0 10px rgba(37,99,235,0); } }

.sys { margin-top: auto; display: grid; gap: 8px; padding: 14px; border-radius: 18px; background: rgba(255,255,255,.5); box-shadow: inset 0 0 0 1px rgba(255,255,255,.7); }
.sys-row { display: grid; grid-template-columns: 10px 1fr auto; gap: 10px; align-items: center; font-size: 13px; color: var(--muted); }
.sys-row b { font: 500 12px/1 var(--f-mono); color: var(--ink); }
.sdot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
.sdot.ok { background: var(--ok); } .sdot.bad { background: var(--bad); } .sdot.warn { background: var(--warn); }
.sdot.live { background: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,.18); }
.sys-meta { margin-top: 4px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 11px; color: var(--muted); line-height: 1.5; }

/* live traffic */
.t-wrap { display: grid; grid-template-columns: auto 1fr; gap: 28px; align-items: stretch; }
@media (max-width: 1100px) { .t-wrap { grid-template-columns: 1fr; } }
.t-kpis { display: grid; grid-template-columns: repeat(2, minmax(110px, auto)); gap: 16px 26px; align-content: center; }
.kpi .v small { font-size: 15px; color: var(--muted); font-weight: 500; letter-spacing: 0; }
.ok-t { color: var(--ok); } .bad-t { color: var(--bad); }
.bars-box { position: relative; min-width: 0; padding-top: 20px; }
.bars { height: 120px; display: flex; align-items: flex-end; gap: 2px; padding: 8px; border-radius: 14px; background: rgba(255,255,255,.55); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
.bars i { flex: 1 1 0; min-width: 2px; border-radius: 3px 3px 1px 1px; transition: height .3s var(--ease); }
.bars i.source, .legend i.source { background: #9AA8BE; }
.bars i.destination, .legend i.destination { background: var(--accent); }
.bars i.fail, .legend i.fail { background: var(--bad); }
.bars .empty { align-self: center; margin: auto; text-align: center; max-width: 60ch; }
.mark { position: absolute; top: 4px; bottom: 30px; width: 0; border-left: 2px dashed var(--accent); pointer-events: none; }
.mark span { position: absolute; top: -2px; left: 6px; font: 600 10.5px/1 var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--accent); background: var(--glass-strong); padding: 3px 5px; border-radius: 5px; white-space: nowrap; }
.mark.m-cut { border-left-color: var(--bad); } .mark.m-cut span { color: var(--bad); }
.mark.m-restore { border-left-color: var(--ok); } .mark.m-restore span { color: var(--ok); }
.legend { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 10px; font-size: 11.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

main { display: grid; gap: 20px; align-content: start; min-width: 0; }
.head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px; padding: 6px 4px 0; }
.head h1 { font-size: clamp(26px, 2.6vw, 36px); font-weight: 600; line-height: 1.1; margin-top: 8px; }
.head p { margin: 8px 0 0; color: var(--muted); max-width: 64ch; }
.head .actions { margin-left: auto; display: flex; gap: 10px; flex-wrap: wrap; }

/* providers strip */
.providers { display: grid; grid-template-columns: 1fr 150px 1fr; gap: 14px; align-items: stretch; }
@media (max-width: 760px) { .providers { grid-template-columns: 1fr; } .route { min-height: 60px; } }
.prov { padding: 18px 20px; display: grid; gap: 8px; transition: opacity .6s var(--ease), filter .6s var(--ease), transform .6s var(--ease); }
.prov .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.prov .name { font-size: 21px; font-weight: 600; letter-spacing: -.02em; }
.prov .meta { font: 12px/1.6 var(--f-mono); color: var(--muted); }
.prov .meta b { color: var(--ink); font-weight: 500; }
.prov.dim { transform: scale(.985); }
.prov.dim > :not(.pill) { opacity: .45; filter: grayscale(1); transition: opacity .6s var(--ease), filter .6s var(--ease); }
.prov.active { box-shadow: inset 0 1px 0 var(--edge), 0 0 0 2px rgba(37,99,235,.55), var(--shadow); }
.sim { font: 500 10.5px/1 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--warn); background: var(--warn-bg); padding: 4px 6px; border-radius: 5px; }
.route { display: grid; place-items: center; position: relative; }
.route .wire { width: 100%; height: 3px; border-radius: 3px; background: linear-gradient(90deg, var(--accent), var(--ok)); transition: opacity .5s, background .5s; }
.route .lbl { position: absolute; top: calc(50% + 12px); font: 500 11px/1.3 var(--f-mono); color: var(--muted); text-align: center; }
.route.cut .wire { background: repeating-linear-gradient(90deg, var(--bad) 0 8px, transparent 8px 14px); }
.route.cut .lbl { color: var(--bad); }

/* panels */
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 20px; }
.panel { grid-column: span 6; padding: 20px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.panel.w7 { grid-column: span 7; } .panel.w5 { grid-column: span 5; } .panel.w12 { grid-column: span 12; }
@media (max-width: 1200px) { .panel, .panel.w7, .panel.w5 { grid-column: span 12; } }
.ph { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.ph h2 { font-size: 18px; font-weight: 600; }
.ph .grow { flex: 1; }
.empty { color: var(--muted); font-size: 14px; padding: 6px 0; }

.kpis { display: flex; flex-wrap: wrap; gap: 22px; }
.kpi .v { font: 700 34px/1 var(--f-ui); letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.kpi .l { font-size: 12.5px; color: var(--muted); margin-top: 4px; }

table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: left; font: 500 11px/1 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
.tw { overflow-x: auto; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }

.src-badge { font: 500 11.5px/1 var(--f-mono); padding: 6px 8px; border-radius: 7px; }
.src-badge.live { background: rgba(37,99,235,.10); color: var(--accent); }
.src-badge.cached, .src-badge.rules { background: var(--warn-bg); color: var(--warn); }
.summary { font-size: 14.5px; line-height: 1.55; margin: 0; max-width: 75ch; }
.risk { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; font-size: 13.5px; padding: 8px 0; border-top: 1px solid var(--line); }
.sev { font: 600 10.5px/1 var(--f-mono); text-transform: uppercase; padding: 5px 6px; border-radius: 5px; }
.sev.high { color: var(--bad); background: var(--bad-bg); } .sev.medium { color: var(--warn); background: var(--warn-bg); } .sev.low { color: var(--muted); background: var(--faint); }
.test { display: grid; grid-template-columns: 34px 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
.test .id { font: 500 12px/1.6 var(--f-mono); color: var(--muted); }
.test .why { color: var(--muted); font-size: 13px; }
.origin { font: 500 10.5px/1 var(--f-mono); color: var(--accent); }
.note { font: 12px/1.5 var(--f-mono); color: var(--warn); }

.res { display: inline-flex; align-items: center; gap: 6px; font: 600 11.5px/1 var(--f-mono); padding: 6px 8px; border-radius: 8px; }
.res.pass { color: var(--ok); background: var(--ok-bg); } .res.fail { color: var(--bad); background: var(--bad-bg); }
.res.unsupported, .res.untested { color: var(--warn); background: var(--warn-bg); border: 1px dashed currentColor; }
tr.bad td { background: color-mix(in srgb, var(--bad-bg) 45%, transparent); }
.err { font: 12px/1.45 var(--f-mono); color: var(--bad); margin-top: 4px; overflow-wrap: anywhere; }

.diff { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font: 13px/1.5 var(--f-mono); padding: 12px 14px; border-radius: 14px; background: rgba(255,255,255,.7); border: 1px solid var(--line); }
.diff .minus { color: var(--bad); } .diff .plus { color: var(--ok); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; font: 12.5px/1.45 var(--f-mono); }
.kv dt { color: var(--muted); } .kv dd { margin: 0; overflow-wrap: anywhere; }
.kv .okc { color: var(--ok); } .kv .badc { color: var(--bad); }
.row-btns { display: flex; flex-wrap: wrap; gap: 8px; }

.log { display: grid; gap: 2px; max-height: 360px; overflow-y: auto; font: 12px/1.45 var(--f-mono); }
.ev { display: grid; grid-template-columns: 74px 1fr; gap: 10px; padding: 6px 4px; border-top: 1px solid var(--line); }
.ev .t { color: var(--muted); }
.ev.incompatibility, .ev.error, .ev.cut { color: var(--bad); }
.ev.retest, .ev.verify, .ev.prove, .ev.switch { color: var(--ok); }

.toast { position: fixed; right: 24px; bottom: 24px; max-width: 460px; padding: 14px 16px; border-radius: 16px; font-size: 14px; color: var(--bad); background: var(--glass-strong); box-shadow: var(--shadow), inset 0 0 0 1px var(--bad-bg); opacity: 0; transform: translateY(8px); transition: .3s var(--ease); pointer-events: none; z-index: 10; }
.toast.on { opacity: 1; transform: none; }
</style>
</head>

<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>
