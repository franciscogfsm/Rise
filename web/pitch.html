<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RISE — Pitch (asset check)</title>
<link rel="icon" href="/static/brand/rise-icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/rise.css">
<style>
/* Placeholder until the cinematic pitch is built: proves the pitch's visuals load through RISE, fresh every time. */
main { max-width: 1200px; margin: 0 auto; padding: 32px 20px; display: grid; gap: 20px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 20px; }
figure { margin: 0; padding: 12px; display: grid; gap: 10px; }
figure img { width: 100%; border-radius: 14px; display: block; background: var(--faint); aspect-ratio: 16 / 9; }
figcaption { font: 12px/1.4 var(--f-mono); color: var(--muted); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>
<main>
  <div class="eyebrow">Pitch asset check · every image below is a fresh request through asset-service</div>
  <div class="ph" style="display:flex;gap:12px;align-items:center"><h1 style="font-size:28px">Served by RISE</h1><button class="btn sm" id="reload" type="button">Request again</button></div>
  <div class="cards" id="cards"></div>
</main>
<script>
const KEYS = ["slides/stat-89.svg", "slides/stat-79.svg", "slides/stat-73.svg", "slides/independência.svg"];
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
async function load() {
  const cards = document.getElementById("cards");
  cards.innerHTML = "";
  for (const key of KEYS) {
    const rid = crypto.randomUUID();
    const fig = document.createElement("figure");
    fig.className = "glass";
    try {
      const r = await fetch(`/app/assets/${encodeURIComponent(key).replace(/%2F/g, "/")}?rid=${rid}`, { cache: "no-store" });
      if (!r.ok) throw new Error((await r.json()).detail || r.status);
      const url = URL.createObjectURL(await r.blob());
      const p = r.headers.get("X-RISE-Provider");
      fig.innerHTML = `<img alt="${esc(key)}" src="${url}"><figcaption><span>${esc(key)}</span><span class="pill ${p === "destination" ? "live" : "idle"}">${esc(p)}</span><span>req ${esc(r.headers.get("X-RISE-Request-Id"))}</span></figcaption>`;
    } catch (e) {
      fig.innerHTML = `<figcaption><span>${esc(key)}</span><span class="pill bad">${esc(e.message)}</span></figcaption>`;
    }
    cards.appendChild(fig);
  }
}
document.getElementById("reload").addEventListener("click", load);
load();
</script>
</body>
</html>
